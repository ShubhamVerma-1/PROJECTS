{% extends "layout.html" %}
{% block title %}Update Profile{% endblock %}

{% block content %}
<div class="container mt-4" style="max-width: 500px;">
    <h3>Update Your Information</h3>
    <form action="" method="post">
        
        <div class="mb-3">
            <label>Name</label>
            <input type="text" name="name" class="form-control" value="{{ user.name }}" required>
        </div>
        
        <div class="mb-3">
            <label>Qualification</label>
            <input type="text" name="qualification" class="form-control" value="{{ profile.qualification }}" required>
        </div>

        <div class="mb-3">
            <label>Resume Link</label>
            <input type="text" name="resume" class="form-control" value="{{ profile.resume_link }}">
        </div>

        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{{ url_for('student_profile') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}

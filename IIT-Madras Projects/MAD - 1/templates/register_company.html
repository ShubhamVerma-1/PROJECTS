<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Register_Company</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

  <div class="d-flex flex-column align-items-center justify-content-center vh-100">
    <div class="border p-5 rounded" style="width: 350px;">
      <h3 class="mb-4 text-center">Register</h3>
      <form action="" method="post">
      {% with messages = get_flashed_messages() %}
        {% if messages %}
        {% for message in messages%}
        <div class="alert alert-warning alert-dismissible fade show" role="alert">
          <strong>{{message}}</strong>
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}
      <div class="mb-3">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="Enter company email" required />
      </div>
      <div class="mb-3">
        <label for="name">Company Name</label>
        <input type="text" id="name" name="company_name" class="form-control" placeholder="Enter company name" required />
      </div>
      <div class="mb-3">
        <label for="website">Company Website</label>
        <input type="text" id="website" name="company_website" class="form-control" placeholder="https://example.com" />
      </div>
      <div class="mb-3">
        <label for="contact">HR Contact</label>
        <input type="tel" id="contact" name="hr_contact" class="form-control" placeholder="HR phone number" />
      </div>
      <div class="mb-3">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Create password" required />
      </div>
      <button type="submit" class="btn btn-success w-100">Register as Company</button>
      </form>
      <p class="mt-3 text-center">
        Already have an account? <a href="{{url_for('login')}}">Login</a>
      </p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>

</html>
